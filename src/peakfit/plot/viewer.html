<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakFit spectrum viewer</title>
<style>
:root { color-scheme: light; font: 14px system-ui, sans-serif; color: #233047; background: #f3f5f8; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; }
header { padding: 16px 24px; background: #172638; color: #fff; display: flex; gap: 20px; align-items: baseline; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
#filename { color: #b9c8d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding: 14px 24px; background: #fff; border-bottom: 1px solid #dce2ea; }
label { display: inline-flex; align-items: center; gap: 7px; }
input, button, select { font: inherit; }
input[type=number] { width: 76px; }
input[type=number], button, select { padding: 5px 8px; border: 1px solid #c9d1de; border-radius: 4px; background: #fff; color: inherit; }
button { cursor: pointer; }
button:hover { background: #eef2f7; }
input[type=checkbox] { accent-color: currentColor; }
input[type=color] { width: 30px; height: 26px; padding: 2px; border: 1px solid #c9d1de; border-radius: 4px; background: #fff; cursor: pointer; }
input:disabled { cursor: default; opacity: .45; }
fieldset { display: flex; flex-wrap: wrap; gap: 14px; border: 0; padding: 0; margin: 0; }
legend { position: absolute; width: 1px; height: 1px; overflow: hidden; }
.layer { display: inline-flex; align-items: center; gap: 8px; }
.layer label { gap: 4px; }
#plot-area { margin: 14px 20px 0; min-width: 0; }
#plot { position: relative; margin: 0 auto; background: #fff; border: 1px solid #dce2ea; border-radius: 6px; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
canvas:focus-visible { outline: 2px solid #1763b0; outline-offset: -3px; }
footer { min-height: 48px; padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: #627087; font-size: 12px; }
#status { color: #233047; } #status.error { color: #b32424; } #cursor { margin-left: auto; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { header, .controls { padding: 12px; gap: 12px; } #plot-area { margin: 8px; } footer { padding: 8px 12px; } }
</style>
</head>
<body>
<header><h1>PeakFit <span style="font-weight:400">/ Spectrum</span></h1><span id="filename"></span></header>
<div class="controls">
<label>Plane <input id="plane" aria-label="Plane" type="number" required min="1" value="1"><span id="plane-count"></span></label>
<label>Base contour <input id="level" aria-label="Base contour" type="number" required min="0.1" max="1000" step="any" value="5"> × noise</label>
<label>Multiplier <select id="factor" aria-label="Contour multiplier">
<option value="2">2.0</option><option value="1.8">1.8</option><option value="1.6">1.6</option>
<option value="1.4" selected>1.4</option><option value="1.3">1.3</option><option value="1.2">1.2</option>
</select></label>
<fieldset id="layers"><legend>Spectrum layers</legend>
<div class="layer">
<label><input type="checkbox" value="experimental" checked>Experimental</label>
<label title="Experimental positive contours">+ <input id="experimental-positive" type="color" aria-label="Experimental positive color" value="#1763b0"></label>
<label title="Experimental negative contours">− <input id="experimental-negative" type="color" aria-label="Experimental negative color" value="#ff0000"></label>
</div>
<div class="layer">
<label><input type="checkbox" value="simulated" checked>Simulated</label>
<label title="Simulated positive contours">+ <input id="simulated-positive" type="color" aria-label="Simulated positive color" value="#ffa500"></label>
<label title="Simulated negative contours">− <input id="simulated-negative" type="color" aria-label="Simulated negative color" value="#008000"></label>
</div>
<div class="layer">
<label><input type="checkbox" value="residual">Residual (exp − sim)</label>
<label title="Residual positive contours">+ <input id="residual-positive" type="color" aria-label="Residual positive color" value="#000000"></label>
<label title="Residual negative contours">− <input id="residual-negative" type="color" aria-label="Residual negative color" value="#000000"></label>
</div>
</fieldset>
<label><input id="labels" type="checkbox" checked>Peak labels</label>
<select id="peak" aria-label="Focus peak"><option value="">Focus peak…</option></select>
<label>Width (%) <input id="plot-width" aria-label="Plot width (%)" type="number" required min="1" step="any" value="100"></label>
<label>Aspect ratio <input id="aspect" aria-label="Plot aspect ratio" title="Plot width divided by height" type="number" required min="0.1" step="any" value="1.0"></label>
<button id="reset" type="button">Reset view</button>
</div>
<div id="plot-area"><main id="plot"><canvas id="spectrum" tabindex="0" aria-label="NMR contour plot. Scroll to zoom, drag to pan, double-click to reset."></canvas></main></div>
<footer><span id="status" role="status" aria-live="polite">Loading spectrum…</span><span>Scroll to zoom · Ctrl-scroll: base · Shift-scroll: multiplier · Drag to pan · +/− colors per layer</span><span id="cursor"></span></footer>
<script type="module" src="viewer.js"></script>
</body>
</html>
